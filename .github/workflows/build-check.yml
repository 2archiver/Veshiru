name: build-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's run; nx2 runs finish so each merge saves its compiler cache.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect source changes
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
    steps:
      - name: Skip builds for documentation-only pull requests
        id: files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Fail open: a listing that cannot be read must never skip the build, so only a
          # successfully fetched, non-empty list of purely documentation paths disables it.
          build=true
          if [ -n "$PR" ]; then
            if files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                 --jq '.[].filename'); then
              if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/.*|.*\.md)$'; then
                build=false
              fi
            else
              echo "::warning::Could not list the pull request's files; building anyway"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  windows-clang-cl:
    name: Windows clang-cl production build and tests
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    # ccache rather than sccache: sccache has no direct mode for clang-cl, so every hit still ran the
    # preprocessor and a 99% hit build took 8.5 minutes.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      # The release job's compiler; ThinLTO is left to the release build to keep this job short.
      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84') {
              throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.2-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      # Restore and save separately so a test failure still keeps the compiled objects.
      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            clang-cl-ccache-qt683-${{ runner.os }}-

      - name: Configure production and tests
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
          "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
          "-DCMAKE_C_FLAGS=-DWIN32 -D_WINDOWS -DNOMINMAX"
          "-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -EHsc -DNOMINMAX"
          -DENABLE_WERROR=ON
          -DBUILD_TESTING=ON
          -DVESHIRU_TESTS=ON
          -DENABLE_QT=ON
          -DENABLE_QT_TRANSLATION=ON
          -DVESHIRU_CMD=ON
          -DVESHIRU_ROOM=OFF
          -DVESHIRU_ROOM_STANDALONE=OFF
          -DVESHIRU_USE_BUNDLED_QT=OFF
          -DVESHIRU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON

      # The install script pins clang-cl by checksum, so it identifies the compiler without hashing
      # the binary on every call.
      - name: Build production and tests
        id: build
        env:
          CCACHE_COMPILERCHECK: string:${{ hashFiles('tools/windows/install-llvm.ps1') }}
        run: |
          ccache --zero-stats
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build-output.txt
          ccache --show-stats -v

      # A Windows-only project cannot reproduce this build elsewhere, so the errors are surfaced
      # as annotations (readable from the checks API and the pull request) and the captured
      # compiler output is uploaded for download, since a job log of a clang-cl build is large and
      # is not always retrievable.
      - name: Summarise build errors
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "### Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE " error: |fatal error|undefined reference|LNK[0-9]+|note: in instantiation" \
            build-output.txt | head -60 | tee -a "$GITHUB_STEP_SUMMARY" | while IFS= read -r line; do
              echo "::error::${line}"
            done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build output
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ github.sha }}
          path: build-output.txt
          retention-days: 3
          if-no-files-found: warn

      # nxformat is linked statically: veshiru.exe must not need an nxformat.dll, which Windows
      # may refuse to load (Smart App Control, code integrity policies) or that may be missing.
      - name: Check veshiru.exe does not import nxformat.dll
        run: |
          imports=$("$LLVM_ROOT/bin/llvm-readobj" --coff-imports build/bin/veshiru.exe |
            awk '/^(Import|DelayImport) {/ { kind = $1 } /^  Name:/ { print kind, $2 }')
          echo "$imports"
          if grep -qi ' nxformat.dll$' <<< "$imports"; then
            echo "::error::veshiru.exe imports nxformat.dll; nxformat must be linked statically"
            exit 1
          fi

      - name: Check Veshiru uses the Windows console subsystem
        run: |
          headers=$("$LLVM_ROOT/bin/llvm-readobj" --file-headers build/bin/veshiru.exe)
          grep -F 'IMAGE_SUBSYSTEM_WINDOWS_CUI' <<< "$headers"

      - name: Run tests
        id: tests
        shell: bash
        # tee keeps the output around for the summary step; pipefail keeps ctest's status.
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error --test-output-size-failed 10000000 \
            --parallel "$NUMBER_OF_PROCESSORS" 2>&1 | tee test-output.txt

      # Surface which tests failed (and their assertion text) without downloading a full log.
      - name: Summarise test failures
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          # Surface each Catch2 assertion, including cases earlier than the output tail.
          details=$(grep -E -A 4 ': FAILED:|FAIL!' test-output.txt | head -200 || true)
          details=${details//$'\r'/}
          printf '::error title=Assertions::%s\n' "${details//$'\n'/%0A}"
          tools/ci/ctest-annotate.sh build test-output.txt rerun
          exit 1

      # compatibility_report fails with an empty Output section and exit code 1. A GUI-subsystem
      # binary sends Qt's warnings to OutputDebugString, where ctest cannot see them, so re-run it
      # with QT_ASSUME_STDERR_HAS_CONSOLE to force them onto stderr, and QT_DEBUG_PLUGINS to show
      # which platform plugin it picks. The PE subsystem tells us whether that is the reason.
      - name: Diagnose failing tests
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          log=build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || exit 0
          exe=$(grep -m1 '^Command: ' "$log" | sed 's/^Command: //; s/"//g')
          directory=$(grep -m1 '^Directory: ' "$log" | sed 's/^Directory: //')
          [ -n "$exe" ] || exit 0
          cd "${directory:-build}" 2>/dev/null || exit 0

          echo "### Direct run of the failing test" >> "$GITHUB_STEP_SUMMARY"
          subsystem=$(MSYS_NO_PATHCONV=1 dumpbin //headers "$exe" 2>/dev/null |
            grep -i 'subsystem' | head -3 || true)
          {
            echo '```'
            echo "exe: $exe"
            echo "Subsystem: ${subsystem:-unknown}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Test subsystem::${subsystem:-unknown}"

          set +e
          out=$(QT_ASSUME_STDERR_HAS_CONSOLE=1 QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=offscreen \
                "$exe" -v1 -platform offscreen 2>&1)
          code=$?
          set -e
          {
            echo "#### Forced-stderr run (exit code: $code)"
            echo '```'
            printf '%s\n' "$out" | tail -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Test exit code::exit code: $code"
          printf '%s\n' "$out" | tail -25 | cut -c1-380 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Test output::$(printf '%s' "$line" | tr -d '\r')"
          done
          exit 0

      - name: Save dependencies and compiler objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}

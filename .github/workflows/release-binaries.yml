name: release-binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag matching VERSION (e.g. v1.3.0)
        type: string
        required: true
      release_title:
        description: Release title (defaults to Veshiru followed by the tag)
        type: string
        required: false
      publish_release:
        description: Create the stable tag and publish from main (off for package validation)
        type: boolean
        default: false

permissions:
  contents: read

# Veshiru is a Windows-exclusive emulator. Only Windows packages are built and published, and the
# Windows job is the only place that ships a PGO variant. veshiru-windows.profdata is a balanced
# multi-game MSVC-ABI profile written by LLVM 22 clang-cl across Switch 1 and Switch 2 workloads;
# it is committed under the source tree, where the configure step reads it.

# Only one release may publish at a time. Validation runs never queue behind a publish.
concurrency:
  group: ${{ inputs.publish_release && 'release-binaries-stable' || format('release-binaries-validate-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source and tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RELEASE" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Publishing requires main; dispatch with publish_release=false to validate a branch" >&2
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "VERSION must be a stable X.Y.Z" >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "release_tag must match VERSION (v$version)" >&2; exit 1; }
          section=$(bash tools/ci/changelog-section.sh "$version")
          [[ -n "$(tr -d '[:space:]' <<< "$section")" ]] || { echo "Missing changelog for $version" >&2; exit 1; }
          if [[ "$PUBLISH_RELEASE" == true ]] && git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]] || { echo "Tag already points to a different commit" >&2; exit 1; }
          fi

  build:
    name: ${{ matrix.platform }} binary
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
          # The windows-x86_64-pgo build is the windows-x86_64 build plus veshiru-windows.profdata,
          # a balanced multi-game MSVC-ABI profile across Switch 1 and Switch 2 titles (see docs/CI.md).
          # Both Windows builds are clang-cl with ThinLTO.
          - platform: windows-x86_64-pgo
            runner: windows-2022
            pgo: true
            profile: veshiru-windows.profdata

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The profile is in the source tree, where the configure step reads it.
      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.profile }}"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # clang-cl compiles against the MSVC headers, libraries and SDK that the previous step put
      # on PATH; only the compiler, linker and archiver come from this LLVM.
      - name: Install LLVM on Windows
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt on Windows
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      # ccache does not handle MSVC-style command lines well, so the clang-cl job uses sccache. The
      # Windows job enables sccache through the launcher variables below.
      - name: Install sccache on Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          $expectedSha = '28BE8C61F6B2C89B9EB2869F6AF7F78E6F992E78A8ABAE0CE855FCC129CBEAC1'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          $actualSha = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash
          if ($actualSha -ne $expectedSha) {
            throw "sccache SHA-256 mismatch: expected $expectedSha, got $actualSha"
          }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          Remove-Item -Force $zip
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .ccache
            .sccache
          # The profile's hash is part of the key, so objects built against an older profile are
          # never restored.
          key: objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-${{ github.sha }}-
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-

      # HD rumble is played by RenHDrum (https://github.com/trzz1214/RenHDrum), a third-party
      # library that Veshiru loads at run time when renhdrum.dll sits next to the executable. The
      # packages ship its prebuilt v0.5.0 binary. The hash is pinned here, not read from the
      # release's own SHA256SUMS.txt, so a replaced release asset fails this step instead of
      # being packaged. Notices: third_party_notices/RenHDrum.txt.
      - name: Download RenHDrum
        shell: pwsh
        env:
          RENHDRUM_URL: https://github.com/trzz1214/RenHDrum/releases/download/v0.5.0/renhdrum.dll
          RENHDRUM_SHA256: C6859C17AD0F9F689FFA00028AB0066454D199C25A98E3FB68F136D1D0049669
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'renhdrum'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dll = Join-Path $dir 'renhdrum.dll'
          Invoke-WebRequest -OutFile $dll $env:RENHDRUM_URL
          $actualSha = (Get-FileHash -Algorithm SHA256 -Path $dll).Hash
          if ($actualSha -ne $env:RENHDRUM_SHA256) {
            throw "renhdrum.dll SHA-256 mismatch: expected $env:RENHDRUM_SHA256, got $actualSha"
          }
          "RENHDRUM_DLL=$($dll -replace '\\', '/')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Veshiru resolves these by name when it loads the library. A build of RenHDrum without one
      # of the first ten leaves HD rumble silently unavailable in the package; without one of the
      # others, the Xbox mix, the Switch 2 mode or DualSense over Bluetooth. Fail here instead.
      - name: Check renhdrum.dll is 64-bit and exports what Veshiru resolves
        shell: pwsh
        run: |
          $headers = (& "$env:LLVM_ROOT/bin/llvm-readobj.exe" --file-headers $env:RENHDRUM_DLL) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch 'IMAGE_FILE_MACHINE_AMD64') {
            throw "renhdrum.dll is not an x86-64 PE file"
          }
          $exports = (& "$env:LLVM_ROOT/bin/llvm-readobj.exe" --coff-exports $env:RENHDRUM_DLL) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "llvm-readobj could not read the export table" }
          $needed = @(
            'renhdrum_engine_create', 'renhdrum_engine_destroy', 'renhdrum_engine_apply_settings',
            'renhdrum_engine_push_half_sample', 'renhdrum_engine_tick', 'renhdrum_settings_resolve',
            'renhdrum_dualsense_dsp_create', 'renhdrum_dualsense_dsp_destroy',
            'renhdrum_dualsense_dsp_set_half_target', 'renhdrum_dualsense_dsp_fill_f32',
            'renhdrum_settings_resolve_pure', 'renhdrum_set_nx2_mode',
            'renhdrum_dualsense_dsp_build_bt_report', 'renhdrum_xbox_rumble_create',
            'renhdrum_xbox_rumble_destroy', 'renhdrum_xbox_rumble_push_half_sample',
            'renhdrum_xbox_rumble_tick', 'renhdrum_xbox_rumble_resend')
          $missing = $needed | Where-Object { $exports -notmatch "Name: $([regex]::Escape($_))\b" }
          if ($missing) { throw "renhdrum.dll does not export: $($missing -join ', ')" }
          Write-Host "renhdrum.dll exports all $($needed.Count) functions Veshiru resolves"

      # A profile older than the source only warns: functions changed since training lose their
      # profile data and are optimized as in the ThinLTO build. clang-cl 22 reads LLVM's indexed
      # profile format 13, so the profile must come from the LLVM that tools/windows installs.
      - name: Configure Windows
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          build_tag="$RELEASE_TAG"
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          if [ -n '${{ matrix.profile }}' ]; then
            flags+=" -fprofile-use=$(cygpath -m "$PWD/${{ matrix.profile }}")"
            flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
            flags+=" -Wno-error=backend-plugin"
          fi
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DVESHIRU_TESTS=OFF \
            -DVESHIRU_CMD=ON \
            -DVESHIRU_ROOM=OFF \
            -DVESHIRU_ROOM_STANDALONE=OFF \
            -DVESHIRU_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DVESHIRU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            "-DVESHIRU_BUILD_TAG=${build_tag}" \
            -DVESHIRU_BUILD_PLATFORM=${{ matrix.platform }} \
            -DUSE_DISCORD_PRESENCE=ON \
            -DENABLE_RENHDRUM=ON \
            "-DRENHDRUM_DLL=$RENHDRUM_DLL" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target veshiru veshiru-cmd veshiru-updater --parallel
          sccache --show-stats

      - name: Stop sccache on Windows
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .ccache
            .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package Windows binary
        shell: pwsh
        run: |
          foreach ($exe in 'veshiru.exe', 'veshiru-cmd.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          # The copy the build made next to the executable must still be the pinned file
          $packagedSha = (Get-FileHash -Algorithm SHA256 -Path build/release/bin/renhdrum.dll).Hash
          $pinnedSha = (Get-FileHash -Algorithm SHA256 -Path $env:RENHDRUM_DLL).Hash
          if ($packagedSha -ne $pinnedSha) {
            throw "build/release/bin/renhdrum.dll is not the file that was downloaded and checked"
          }
          windeployqt --release --dir build/release/bin --libdir build/release/bin --plugindir build/release/bin/plugins --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler --no-translations build/release/bin/veshiru.exe

      - name: Verify packaged console executables and version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = [regex]::Escape("Veshiru $env:RELEASE_TAG (")
          Push-Location build/release/bin
          try {
            foreach ($exe in 'veshiru.exe', 'veshiru-cmd.exe') {
              $headers = & "$env:LLVM_ROOT/bin/llvm-readobj.exe" --file-headers "./$exe"
              if ($LASTEXITCODE -ne 0 -or ($headers -join "`n") -notmatch 'IMAGE_SUBSYSTEM_WINDOWS_CUI') {
                throw "$exe is not a console-subsystem executable"
              }
              $output = & "./$exe" --version
              if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch $version) {
                throw "$exe --version did not report $env:RELEASE_TAG (exit ${LASTEXITCODE}): $output"
              }
              Write-Host "$exe reports $env:RELEASE_TAG"
            }
          } finally {
            Pop-Location
          }

      - name: Include licenses and model notices
        shell: pwsh
        run: |
          Copy-Item LICENSE.txt -Destination build/release/bin
          Copy-Item third_party_notices -Destination build/release/bin -Recurse

      # The artifact is the bin folder itself: GitHub zips artifacts on download, and uploading a
      # zip gave a zip inside a zip. The release job zips it once for the release.
      - name: Upload Windows binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: veshiru-${{ matrix.platform }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Verify release archives
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: veshiru-*-${{ github.sha }}
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          # The checkout already contains a dist/ directory (themes, icons, installer), so the
          # release output goes to release-dist/ to keep gh release create's glob to the archives.
          mkdir release-dist
          # Asset names drop the commit sha: the release tag already identifies the build, and
          # stable names let the notes table link to them.
          strip_sha() { sed "s/-${GITHUB_SHA}//" <<< "$1"; }
          for artifact in artifacts/*/; do
            name=$(strip_sha "$(basename "$artifact")")
            archive="${name}.zip"
            (cd "$artifact" && zip -qr "${GITHUB_WORKSPACE}/release-dist/${archive}" .)
          done

          # The in-app update checker builds its asset URL as veshiru-<platform>[-pgo].zip from the
          # platform string compiled into the binary, so the archives keep those names on stable
          # releases too; renaming them here would silently disable updates.
          for name in veshiru-windows-x86_64 veshiru-windows-x86_64-pgo; do
            unzip -tq "release-dist/$name.zip"
          done
          (cd release-dist && sha256sum -- *.zip > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Upload verified archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: veshiru-package-${{ inputs.release_tag }}-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 7

  # Dry runs stop at the verified archives. Only an explicit dispatch from main may publish.
  release:
    name: Publish release
    needs: package
    if: inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: veshiru-package-${{ inputs.release_tag }}-${{ github.sha }}
          path: release-dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          link() { [[ -e "release-dist/$2" ]] && echo "[$1](${base}/$2)" || true; }
          test -f release-dist/veshiru-windows-x86_64.zip
          test -f release-dist/veshiru-windows-x86_64-pgo.zip

          assets_table() {
            {
              echo '| Build Type | Standard | PGO (Recommended) | Notes |'
              echo '| --- | --- | --- | --- |'
              echo "| amd64 / x86_64 | $(link zip veshiru-windows-x86_64.zip) | $(link "PGO zip" veshiru-windows-x86_64-pgo.zip) | Both built with clang-cl and ThinLTO; the PGO zip uses a balanced multi-game Switch 1 & Switch 2 profile |"
            }
          }

          # Manually tagged stable release: the description is the short, user-facing notes for the
          # version (docs/release-notes/<version>.md) when they exist, and the matching CHANGELOG
          # section otherwise. Windows-only and download instructions follow either way.
          title="${RELEASE_TITLE:-Veshiru $RELEASE_TAG}"
          version="${RELEASE_TAG#v}"
          section=$(bash tools/ci/release-description.sh "$version")
          if [ -z "$(tr -d '[:space:]' <<< "$section")" ]; then
            echo "No release notes and no non-empty CHANGELOG [$version] section" >&2
            exit 1
          fi
          {
            printf '%s\n\n' "$section"
            echo "Full technical notes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md)"
            echo
            echo "Veshiru is a Windows-exclusive emulator: it is built and tested for 64-bit Windows 10 and 11 only."
            echo
            echo "Extract the entire zip and run \`veshiru.exe\`, or \`veshiru-cmd.exe\` from a terminal."
            echo
            assets_table
            echo
            echo "The PGO build is compiled with profile-guided optimization using a balanced multi-game Switch 1 & Switch 2 runtime profile (\`veshiru-windows.profdata\`). Prefer it on modern x86_64 CPUs."
          } > notes.md
          # Create the tag only after both packages are ready. Existing tags must name this commit.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]] || { echo "Tag points to a different commit" >&2; exit 1; }
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          gh release create "${tag}" release-dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "$title" \
            --notes-file notes.md

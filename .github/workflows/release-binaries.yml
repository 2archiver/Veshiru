name: release-binaries

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true
      release_tag:
        description: Tag the release manually (e.g. v1.1.0) instead of the build-N tag. The tag is created at this commit and the release is marked stable.
        type: string
        default: ""
      release_title:
        description: Title for the manually tagged release (e.g. Veshiru 1.1). Defaults to "Veshiru <tag>".
        type: string
        default: ""
  push:
    branches:
      - nx2-experimental
    # A binary only changes when build inputs change; docs-only pushes skip the build.
    paths:
      - "src/**"
      # Test-only changes cannot change a binary: the build configures with BUILD_TESTING=OFF and
      # VESHIRU_TESTS=OFF below, so a push that only touches src/tests has nothing to rebuild.
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - "*.profdata"
      - ".github/workflows/release-binaries.yml"

permissions:
  contents: read

# Veshiru is a Windows-exclusive emulator. Only Windows packages are built and published, and the
# Windows job is the only place that ships a PGO variant. veshiru-windows.profdata is an
# MSVC-ABI profile written by a current clang-cl and trained in Veshiru on Ocarina of Time; it is
# committed under the source tree, where the configure step reads it.

# A running build is never cancelled: it finishes and publishes. A push meanwhile queues one build;
# a later push replaces it, so the newest commit builds as soon as the running one is done.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare release tag
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-build-${GITHUB_RUN_NUMBER}}"
          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $tag points to $tag_sha instead of $GITHUB_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

  build:
    name: ${{ matrix.platform }} binary
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
          # The windows-x86_64-pgo build is the windows-x86_64 build plus veshiru-windows.profdata,
          # an MSVC-ABI profile trained on Ocarina of Time (see docs/CI.md). Both Windows builds
          # are clang-cl with ThinLTO.
          - platform: windows-x86_64-pgo
            runner: windows-2022
            pgo: true
            profile: veshiru-windows.profdata

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # The profile is in the source tree, where the configure step reads it.
      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.profile }}"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # clang-cl compiles against the MSVC headers, libraries and SDK that the previous step put
      # on PATH; only the compiler, linker and archiver come from this LLVM.
      - name: Install LLVM on Windows
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      # ccache does not handle MSVC-style command lines well, so the clang-cl job uses sccache. The
      # Windows job enables sccache through the launcher variables below.
      - name: Install sccache on Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .sccache
          # The profile's hash is part of the key, so objects built against an older profile are
          # never restored.
          key: objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-${{ github.sha }}-
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v2-

      # A profile older than the source only warns: functions changed since training lose their
      # profile data and are optimized as in the ThinLTO build. clang-cl 22 reads LLVM's indexed
      # profile format 13, so the profile must come from the LLVM that tools/windows installs.
      - name: Configure Windows
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          if [ -n '${{ matrix.profile }}' ]; then
            flags+=" -fprofile-use=$(cygpath -m "$PWD/${{ matrix.profile }}")"
            flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
            flags+=" -Wno-error=backend-plugin"
          fi
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DVESHIRU_TESTS=OFF \
            -DVESHIRU_CMD=ON \
            -DVESHIRU_ROOM=OFF \
            -DVESHIRU_ROOM_STANDALONE=OFF \
            -DVESHIRU_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DVESHIRU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DVESHIRU_BUILD_TAG=build-${{ github.run_number }} \
            -DVESHIRU_BUILD_PLATFORM=${{ matrix.platform }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target veshiru veshiru-cmd veshiru-updater --parallel
          sccache --show-stats

      - name: Stop sccache on Windows
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package Windows binary
        shell: pwsh
        run: |
          foreach ($exe in 'veshiru.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations build/release/bin/veshiru.exe

      # The artifact is the bin folder itself: GitHub zips artifacts on download, and uploading a
      # zip gave a zip inside a zip. The release job zips it once for the release.
      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: veshiru-${{ matrix.platform }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

  # Publishes every binary as a GitHub pre-release once every build succeeded: on pushes to
  # nx2-experimental, and on manual runs unless "Publish the binaries as a GitHub release" is
  # unticked.
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: veshiru-*-${{ github.sha }}
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          # Asset names drop the commit sha: the release tag already identifies the build, and
          # stable names let the notes table link to them.
          strip_sha() { sed "s/-${GITHUB_SHA}//" <<< "$1"; }
          for artifact in artifacts/*/; do
            name=$(basename "$artifact")
            (cd "$artifact" && zip -qr "${GITHUB_WORKSPACE}/dist/$(strip_sha "$name").zip" .)
          done
          ls -la dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-build-${GITHUB_RUN_NUMBER}}"
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag $tag points to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          link() { [[ -e "dist/$2" ]] && echo "[$1](${base}/$2)" || true; }
          test -f dist/veshiru-windows-x86_64.zip
          test -f dist/veshiru-windows-x86_64-pgo.zip

          assets_table() {
            {
              echo '| Build Type | Standard | PGO (Recommended) | Notes |'
              echo '| --- | --- | --- | --- |'
              echo "| amd64 / x86_64 | $(link zip veshiru-windows-x86_64.zip) | $(link "PGO zip" veshiru-windows-x86_64-pgo.zip) | Both built with clang-cl and ThinLTO; the PGO zip adds a profile trained on Ocarina of Time |"
            }
          }

          if [ -n "$RELEASE_TAG" ]; then
            # Manually tagged stable release: the notes come from the matching CHANGELOG section.
            title="${RELEASE_TITLE:-Veshiru $RELEASE_TAG}"
            version="${RELEASE_TAG#v}"
            changelog=$(gh api "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=${GITHUB_SHA}" --jq .content | base64 -d)
            section=$(awk -v name="$version" '
              $0 == "## [" name "]" || index($0, "## [" name "] - ") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' <<< "$changelog")
            if [ -z "$(tr -d '[:space:]' <<< "$section")" ]; then
              echo "CHANGELOG.md has no non-empty [$version] section" >&2
              exit 1
            fi
            {
              printf '%s\n\n' "$section"
              echo "Veshiru is a Windows-exclusive emulator: it is built and tested for 64-bit Windows 10 and 11 only."
              echo
              echo "Extract the entire zip and run \`veshiru.exe\`, or \`eden-cli.exe\` from a terminal."
              echo
              assets_table
              echo
              echo "The PGO build is the same program compiled with profile-guided optimization using a profile trained in Veshiru on Ocarina of Time, so other games gain less. Prefer it when your CPU supports it."
            } > notes.md
            gh release create "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "$title" \
              --notes-file notes.md
          else
            {
              printf 'Automatic build of `%s` at %s.\n\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"
              echo 'Veshiru is a Windows-exclusive emulator. Linux and macOS packages are no longer produced.'
              echo
              echo '## Windows'
              echo
              echo 'Windows packages are in-place zip files: extract and run `veshiru.exe`, or `eden-cli.exe` from a terminal.'
              echo
              assets_table
              echo
              echo 'The PGO build is the same program compiled with profile-guided optimization using a profile trained in Veshiru on Ocarina of Time, so other games gain less. Prefer it when your CPU supports it.'
            } > notes.md

            gh release create "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --prerelease \
              --title "Veshiru ${GITHUB_REF_NAME} build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
              --notes-file notes.md
          fi

      # VESHIRU_BUILD_TAG is baked into every binary as build-<run number>, and the update checker
      # compares release tags against it. A release whose tag or title names another run would be
      # skipped or offered wrongly, so fail the run instead of leaving it published.
      - name: Verify the release tag matches the run number
        if: (github.event_name == 'push' || inputs.publish_release) && !inputs.release_tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="build-${GITHUB_RUN_NUMBER}"
          published_tag=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')
          published_title=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json name --jq '.name')
          if [ "$published_tag" != "$expected" ] || [[ "$published_title" != *" build ${GITHUB_RUN_NUMBER} ("* ]]; then
            echo "Release is tagged '$published_tag' and titled '$published_title', expected tag $expected and a title naming build ${GITHUB_RUN_NUMBER}"
            exit 1
          fi
